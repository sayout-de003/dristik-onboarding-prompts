name: Enterprise quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/evidence-first-enterprise-audits
      - feat/complete-integration-platform

permissions:
  contents: read

jobs:
  evidence-integrity:
    name: Evidence integrity contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt
      - name: Compile backend modules
        run: python -m compileall -q app
      - name: Run evidence integrity tests
        run: python -m pytest tests/test_evidence_integrity_contract.py tests/test_platform_registry_contract.py tests/test_webhook_security.py tests/test_report_quality_and_deep_crawl.py tests/test_scoring_missing_measurements.py tests/test_report_integrity_gate.py tests/test_connector_freshness.py tests/test_crawl_response_limits.py tests/test_agent_contracts.py tests/test_critical_runtime_imports.py tests/test_displayed_score_integrity.py tests/test_export_integrity.py tests/test_production_settings.py tests/security/test_tenant_isolation.py tests/unit/test_score_engine.py tests/unit/test_seo_finding_deduplicator.py -q

  frontend:
    name: Frontend typecheck, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Frontend tests
        run: npm test
